<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fundamentals: Intelligent Greenhouses of Astana</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--background, #1a1a2e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    /* ── Book Container ── */
    .book-scene {
      perspective: 1800px;
      width: 900px;
      height: 600px;
      position: relative;
    }

    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    /* ── Each leaf (front + back) ── */
    .page {
      position: absolute;
      width: 50%;
      height: 100%;
      right: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1.000);
      z-index: 1;
      cursor: pointer;
    }

    .page.flipped {
      transform: rotateY(-180deg);
    }

    .page-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      overflow: hidden;
      border-radius: 0 8px 8px 0;
    }

    .page-front {
      background: #faf8f5;
      z-index: 2;
      box-shadow: inset -4px 0 12px rgba(0,0,0,0.08), 2px 0 8px rgba(0,0,0,0.1);
    }

    .page-back {
      background: #faf8f5;
      transform: rotateY(180deg);
      border-radius: 8px 0 0 8px;
      box-shadow: inset 4px 0 12px rgba(0,0,0,0.08), -2px 0 8px rgba(0,0,0,0.1);
    }

    /* ── Static back cover (left side) ── */
    .back-cover {
      position: absolute;
      width: 50%;
      height: 100%;
      left: 0;
      background: linear-gradient(135deg, #1e3a2f 0%, #0f2318 100%);
      border-radius: 8px 0 0 8px;
      box-shadow: inset 4px 0 15px rgba(0,0,0,0.3);
      z-index: 0;
    }

    /* ── Front hard cover ── */
    .hard-cover-front {
      background: linear-gradient(135deg, #1a5c3a 0%, #0d3320 60%, #0a2a18 100%);
      border-radius: 0 8px 8px 0;
      box-shadow: inset -3px 0 10px rgba(0,0,0,0.4), 3px 0 15px rgba(0,0,0,0.3);
    }

    .hard-cover-back-face {
      background: #f5f0e8;
      border-radius: 0 8px 8px 0;
    }

    /* ── Page content styling ── */
    .page-content {
      padding: 32px 28px;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #d4c9b8 transparent;
    }

    .page-content::-webkit-scrollbar { width: 4px; }
    .page-content::-webkit-scrollbar-thumb { background: #c9b99a; border-radius: 2px; }
    .page-content::-webkit-scrollbar-track { background: transparent; }

    .page-content h2 {
      font-family: 'Merriweather', serif;
      font-size: 17px;
      font-weight: 700;
      color: #1a2e1a;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .page-content .chapter-label {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #6b8f71;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }

    .page-content .topic-label {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9aaa8e;
      float: right;
    }

    .page-content p {
      font-family: 'Merriweather', serif;
      font-size: 12px;
      line-height: 1.75;
      color: #3a3a3a;
      margin-bottom: 10px;
      text-align: justify;
      hyphens: auto;
    }

    .page-content ul {
      margin: 6px 0 10px 16px;
      font-family: 'Merriweather', serif;
      font-size: 12px;
      line-height: 1.7;
      color: #3a3a3a;
    }

    .page-content ul li { margin-bottom: 3px; }

    .page-content .note-box {
      background: #eef5ee;
      border-left: 3px solid #4a8c5c;
      padding: 8px 12px;
      border-radius: 0 6px 6px 0;
      margin-top: 8px;
      font-size: 11px;
      color: #2a5a3a;
      line-height: 1.5;
    }

    .page-content .formula-box {
      background: #1a2e1a;
      color: #6fcf97;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 14px;
      letter-spacing: 1px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
    }

    .page-content .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 8px 0;
    }

    .page-content .info-card {
      background: #fff;
      border: 1px solid #e0ddd5;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .page-content .info-card h4 {
      font-family: 'Merriweather', serif;
      font-size: 11px;
      font-weight: 700;
      color: #1a2e1a;
      margin-bottom: 2px;
    }

    .page-content .info-card p {
      font-size: 10.5px;
      line-height: 1.4;
      margin: 0;
      text-align: left;
    }

    .page-content .mdp-box {
      background: #fff;
      border: 1px solid #e0ddd5;
      padding: 10px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      margin: 8px 0;
    }

    .page-content .mdp-box .desc {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      color: #666;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* Page number at bottom */
    .page-number {
      font-family: 'Merriweather', serif;
      font-size: 10.5px;
      color: #aaa;
      text-align: center;
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid #e8e4dc;
    }

    /* ── Cover design ── */
    .cover-content {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 30px;
      text-align: center;
      color: #d4e8d4;
      position: relative;
    }

    .cover-content::before {
      content: '';
      position: absolute;
      top: 20px; left: 20px; right: 20px; bottom: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px;
      pointer-events: none;
    }

    .cover-content .badge {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #6fcf97;
      border: 1px solid rgba(111,207,151,0.3);
      padding: 5px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
      background: rgba(111,207,151,0.08);
    }

    .cover-content h1 {
      font-family: 'Merriweather', serif;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 14px;
    }

    .cover-content .subtitle {
      font-size: 12px;
      color: #a0c4a0;
      line-height: 1.5;
      max-width: 320px;
      margin-bottom: 28px;
    }

    .cover-content .authors {
      font-size: 11px;
      color: #7aa87a;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 16px;
    }

    /* ── Spine shadow ── */
    .spine-shadow {
      position: absolute;
      left: 50%;
      top: 0;
      width: 30px;
      height: 100%;
      transform: translateX(-50%);
      background: linear-gradient(to right,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.05) 30%,
        rgba(0,0,0,0) 50%,
        rgba(0,0,0,0.05) 70%,
        rgba(0,0,0,0.15) 100%
      );
      z-index: 999;
      pointer-events: none;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 28px;
      z-index: 100;
    }

    .controls button {
      background: var(--card, #2a2a4a);
      color: var(--foreground, #e0e0e0);
      border: 1px solid var(--border, #3a3a5a);
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls button:hover:not(:disabled) {
      background: var(--accent, #3a3a6a);
      transform: translateY(-1px);
    }

    .controls button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 13px;
      color: var(--muted-foreground, #999);
      font-weight: 500;
      min-width: 120px;
      text-align: center;
    }

    /* ── Table of Contents on the inner cover ── */
    .toc-content {
      padding: 26px 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .toc-content h3 {
      font-family: 'Merriweather', serif;
      font-size: 15px;
      font-weight: 700;
      color: #1a2e1a;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #4a8c5c;
    }

    .toc-content .toc-item {
      display: flex;
      align-items: baseline;
      padding: 3px 0;
      font-size: 11px;
      color: #555;
      cursor: pointer;
      transition: color 0.2s;
    }

    .toc-content .toc-item:hover { color: #1a5c3a; }

    .toc-content .toc-num {
      font-weight: 600;
      color: #4a8c5c;
      min-width: 24px;
    }

    .toc-content .toc-title { flex: 1; }

    .toc-content .toc-dots {
      flex: 1;
      border-bottom: 1px dotted #ccc;
      margin: 0 4px;
      min-width: 15px;
    }

    .toc-content .toc-page {
      font-weight: 500;
      color: #888;
      min-width: 18px;
      text-align: right;
    }

    /* Book edge texture */
    .book-edge-top, .book-edge-bottom {
      position: absolute;
      left: 0; right: 0;
      height: 3px;
      z-index: 998;
      pointer-events: none;
    }
    .book-edge-top {
      top: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), transparent);
    }
    .book-edge-bottom {
      bottom: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.1), transparent);
    }

    /* ── Paper texture overlay ── */
    .paper-texture {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      pointer-events: none;
      border-radius: inherit;
    }
  </style>
</head>

            <div class="toc-item" onclick="goToPage(8)"><span class="toc-num">8.</span><span class="toc-title">Local Search & Hill Climbing</span><span class="toc-dots"></span><span class="toc-page">16</span></div>

            <div class="toc-item" onclick="goToPage(11)"><span class="toc-num">11.</span><span class="toc-title">Adversarial Search & Minimax</span><span class="toc-dots"></span><span class="toc-page">22</span></div>

            <div class="toc-item" onclick="goToPage(15)"><span class="toc-num">15.</span><span class="toc-title">RL & Hidden Markov Models</span><span class="toc-dots"></span><span class="toc-page">30</span></div>
          </div>

      },
      // Page 1: Ch.1 Introduction
      {
        front: `<div class="page-face page-front">
          <div class="paper-texture"></div>
          <div class="page-content">
            <span class="chapter-label">Chapter 1 of 15</span>
            <span class="topic-label">Introduction</span>
            <h2>The Frozen Horizon</h2>
            <p>The winter wind howled across the snow-covered steppes surrounding Astana, Kazakhstan, sweeping past the monumental futuristic towers of the city. Outside, temperatures routinely plummeted far below freezing. Yet, inside a sprawling state-of-the-art agricultural complex, rows of lush green crops thrived under warm LED lights.</p>
            <p>This modern miracle was not maintained entirely by human hands. It was the domain of autonomous artificial intelligence systems designed to protect fragile life against a harsh, stochastic environment. In this book, we explore the core paradigms of AI—from simple reflex agents to complex decision-theoretic planning—using the lifeblood of this greenhouse as our guiding narrative.</p>

            <h2>The Simple Reflex Agent</h2>
